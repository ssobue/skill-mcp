spring:
  application:
    name: skill-mcp
  main:
    banner-mode: off
  profiles:
    active: dev
  ai:
    mcp:
      server:
        protocol: STATELESS
        type: SYNC
        name: skill-mcp
        version: 0.0.1
        instructions: "Search and locate organization Skills stored in distributed Git repositories."
        capabilities:
          completion: false
        annotation-scanner:
          enabled: true

logging:
  level:
    root: info
    org.springframework: warn

skill-mcp:
  scan:
    roots:
      - .
    fixed-delay-millis: 300000
  github:
    base-api-url: https://api.github.com
    app-id: ${GITHUB_APP_ID:}
    installation-id: ${GITHUB_APP_INSTALLATION_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    private-key-path: ${GITHUB_APP_PRIVATE_KEY_PATH:}
    repositories: []
